<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colors</title>
    <style>
        h1 {
            color: darkgreen;
        }

        h2 {
            color: #660019;
        }

        h3 {
            color: rgb(rgb(254, 4, 4), green, blue)
        }

        h4 {
            color: rgba(rgba(255, 0, 0, 0.598), green, blue, alpha)
        }

        h5 {
            color: hsl(hue, saturation, lightness);
        }
    </style>
</head>

<body>
    <h1>color keyword</h1>
    <h2> hex code</h2>
    <h3> RGB</h3>
    <h4>RGBA</h4>
    <h5>HSL</h5>

</body>

</html>
