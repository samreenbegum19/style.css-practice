<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadows and outliers</title>
    <style>
        .shadow{
            border: 2px solid black;
            padding: 5px;
            box-shadow: 2px 1px 3px red;
        }
        .text-element{
            text-shadow: 2px 2px 4px rgb(122, 122, 239);
        }
        .liers{
            outline: 2px solid black;
            border: 2px solid blue;
        outline-offset:15px;
        border-radius: 10px;

        }
            
        
    </style>
</head>
<body>
    <div class="shadow">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Totam, ipsa.
    </div>
    <div class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing.
    </div>
    <div class="liers">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Deserunt, ratione.
    </div>
    
</body>
</html>
